[project]
name = "lteann"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jannabiforever", email = "jungini1226@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
lteann = "lteann:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.basedpyright]
# "standard" matches pyright's defaults; basedpyright's own default flags every Unknown.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
